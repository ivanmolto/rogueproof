name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # gitleaks scans the whole history
      - name: Install gitleaks (pinned; same rules as the pre-commit hook)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks && sudo install -m 0755 gitleaks /usr/local/bin/gitleaks && rm gitleaks gitleaks.tar.gz
          gitleaks version
      - name: Secret scan (every commit in history)
        run: gitleaks git --redact --no-banner --config .gitleaks.toml --exit-code 1 .
      - uses: pnpm/action-setup@v5
        with:
          version: 11.11.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Schema drift
        run: |
          pnpm gen:schemas:check
          pnpm gen:schemas
          git diff --exit-code -- shared/src/generated
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm -r build
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests (offline; [otari] and [sandbox] suites skipped; gitleaks tests run)
        run: pnpm test
