# gitleaks config: the default ruleset plus Otari key shapes.
# Used by .githooks/pre-commit. Values containing FAKE (fixtures, the mission's
# fake .env) are allowed; everything else that looks like a key is refused.
title = "rogueproof"

[extend]
useDefault = true

[[rules]]
id = "otari-workspace-key"
description = "Otari workspace API key as issued by the dashboard (otk_v1_<region>_ prefix, seen 2026-11-08)"
regex = '''\botk_v1_[a-z]{2,3}_[A-Za-z0-9_\-]{6,}'''
keywords = ["otk_v1_"]

[[rules]]
id = "otari-api-key"
description = "Otari API key (tk- prefix, the shape the plan assumed)"
regex = '''\btk-[A-Za-z0-9_\-]{6,}'''
keywords = ["tk-"]

[[rules]]
id = "otari-gateway-key"
description = "Otari gateway key (gw_ prefix)"
regex = '''\bgw_[A-Za-z0-9_\-]{6,}'''
keywords = ["gw_"]

[[allowlists]]
description = "Fake values used in fixtures and the mission workspace"
regexTarget = "match"
regexes = ['''FAKE''']

[[allowlists]]
description = "The plan's DoD names the dummy key that the hook must refuse; allowed only there"
targetRules = ["otari-api-key"]
condition = "AND"
paths = ['''(^|/)docs/rogueproof-plan\.md$''']
regexes = ['''^tk-abcdef$''']
